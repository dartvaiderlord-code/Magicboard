name: Build debug APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]]; then
            sdkmanager "platforms;android-35" "build-tools;34.0.0"
          fi
      - name: Test and build APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: magicboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
